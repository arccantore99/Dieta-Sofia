<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dieta Sofia">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Dieta Sofia</title>
<meta name="theme-color" content="#f6f2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#130e11" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app a colonna singola (max 560px), header fisso in alto, barra di navigazione stile Android in basso */
:root{
  --bg:#f6f2f4; --surface:#ffffff; --surface-2:#eee4e9; --ink:#25161e; --muted:#6b5862; --line:#e1d4db;
  --accent:#8e3b63; --accent-ink:#ffffff; --accent-soft:#f2dde7;
  --kcal:#9a5d00; --kcal-soft:#f6e7c8;
  --t-A:#8e3b63; --t-R:#8a7c83; --t-C:#2f7c88;
  --m0:#e0a43a; --m1:#e2b4c7; --m2:#8e3b63; --m3:#c77b9c; --m4:#55203d; --m5:#a9919d;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#130e11; --surface:#1c151a; --surface-2:#281e24; --ink:#f0e5eb; --muted:#a8959f; --line:#362a31;
  --accent:#e58cb3; --accent-ink:#130e11; --accent-soft:#3b2231;
  --kcal:#eab554; --kcal-soft:#382b12;
  --t-A:#e58cb3; --t-R:#9b8b93; --t-C:#5fbccb;
  --m0:#e8b04f; --m1:#ebc3d3; --m2:#d47ba2; --m3:#b56b8c; --m4:#8d3c64; --m5:#8a7680;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#130e11; --surface:#1c151a; --surface-2:#281e24; --ink:#f0e5eb; --muted:#a8959f; --line:#362a31;
  --accent:#e58cb3; --accent-ink:#130e11; --accent-soft:#3b2231;
  --kcal:#eab554; --kcal-soft:#382b12;
  --t-A:#e58cb3; --t-R:#9b8b93; --t-C:#5fbccb;
  --m0:#e8b04f; --m1:#ebc3d3; --m2:#d47ba2; --m3:#b56b8c; --m4:#8d3c64; --m5:#8a7680;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 8px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
.top-sub{font-size:12px;color:var(--muted);text-align:right}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:4px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--muted);font-size:11.5px;font-weight:600}
.tab .ic{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{background:var(--accent-soft);color:var(--accent)}

h2.h{font-family:var(--f-display);font-weight:700;font-size:24px;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);margin:0}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

/* segmented + chips */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.mini{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:2px 4px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:13.5px}

/* dieta */
.today-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid transparent;background:none;border-radius:12px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.day .dn{font-weight:700;font-size:14px;color:var(--ink)}
.day .dt{width:6px;height:6px;border-radius:50%}
.day .dk{font-size:10.5px;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--surface);border-color:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.day.is-today .dn{color:var(--accent)}
.dt.t-A,.badge.t-A{background:var(--t-A)} .dt.t-R,.badge.t-R{background:var(--t-R)} .dt.t-C,.badge.t-C{background:var(--t-C)}
.badge{display:inline-block;color:var(--bg);font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:4px}
.sum-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.total{text-align:right;line-height:1}
.total .num{font-family:var(--f-display);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.total .unit{font-size:14px;color:var(--muted);margin-left:4px;font-weight:600}
.total .plus{display:block;font-size:12px;color:var(--kcal);font-weight:700;margin-top:4px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:14px;gap:2px;background:var(--surface-2)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i,.mdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
.m0{background:var(--m0)}.m1{background:var(--m1)}.m2{background:var(--m2)}.m3{background:var(--m3)}.m4{background:var(--m4)}.m5{background:var(--m5)}
.meal header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meal h3{margin:0;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kc-chip{font-size:13px;font-weight:700;color:var(--kcal);background:var(--kcal-soft);border-radius:8px;padding:3px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kc-chip.free{color:var(--accent);background:var(--accent-soft)}
.desc{margin:8px 0 0;font-size:16px;line-height:1.4}
.desc b{font-weight:700}
.meal.is-none .desc{color:var(--muted)}
.meal-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;align-items:center}
details summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:13.5px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details[open] summary::before{content:"▾ "}
ul.kc{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
ul.kc li{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
ul.kc li .q{color:var(--muted)} ul.kc li .k{font-weight:700;min-width:62px;text-align:right}
.target{font-size:13px;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px}

/* spesa */
.field{display:flex;flex-direction:column;gap:8px}
.lab{display:flex;align-items:center;gap:8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.lab .sp{flex:1}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:12px}
.stepper button{border:0;background:none;width:40px;height:38px;font-size:20px;font-weight:700;color:var(--accent)}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.group{display:flex;flex-direction:column}
.group h4{margin:6px 0 4px;font-family:var(--f-display);font-size:16px;font-weight:700;display:flex;justify-content:space-between}
.group h4 small{font-family:var(--f-body);color:var(--muted);font-size:12px;font-weight:600}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);grid-row:span 2;margin:0}
.item .nm{font-weight:600;min-width:0}
.item .q{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .src{grid-column:2 / 4;font-size:12px;color:var(--muted)}
.item.done .nm,.item.done .q{text-decoration:line-through;color:var(--muted)}
.item .del{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.addf{display:flex;gap:8px;margin:6px 0 4px}
.addf input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
textarea#copybox{width:100%;min-height:160px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;font-size:13px}

/* calcolatrice */
select,.numin input,.factor input,.setting input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;width:100%}
.numin{display:flex;align-items:center;gap:8px}
.numin input{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.numin span{font-weight:700;color:var(--muted);font-size:18px}
.result{background:var(--accent);color:var(--accent-ink);border:0}
.result .eyebrow{color:inherit;opacity:.85}
.result .big{font-family:var(--f-display);font-weight:800;font-size:48px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.result .sub{font-size:14px;opacity:.9;margin-top:4px}
.tbl-wrap{overflow-x:auto}
table.ft{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
table.ft td,table.ft th{padding:7px 4px;border-top:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
table.ft th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
table.ft td:last-child,table.ft th:last-child{text-align:right}
table.ft tr.grp td{font-weight:700;color:var(--accent);border-top:0;padding-top:12px}

/* ricette */
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;width:100%}
.rcard .rt{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2}
.rcard .rm{grid-column:1 / 3;font-size:12.5px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--surface-2);color:var(--muted);margin-right:6px}
.tag.diet{background:var(--accent-soft);color:var(--accent)}
.rdetail h3{font-family:var(--f-display);font-size:24px;margin:6px 0 4px;line-height:1.15;text-wrap:balance}
.rdetail ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.rdetail ul.ing{list-style:none;margin:6px 0 0;padding:0}
.rdetail ul.ing li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.rdetail ul.ing li span:last-child{color:var(--muted);white-space:nowrap}
.rdetail h4{margin:14px 0 2px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;font-size:15px}

/* piano */
.plan details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.plan details summary{font-family:var(--f-display);color:var(--ink);font-size:17px}
.plan details summary::before{color:var(--accent)}
.pm{margin-top:12px}
.pm h5{margin:0 0 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.pm ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.pm .alt{font-size:12.5px;font-weight:700;color:var(--muted);margin:6px 0 2px}
.freq{display:grid;grid-template-columns:1fr auto;gap:0 12px;margin-top:8px}
.freq div{padding:7px 0;border-top:1px solid var(--line)}
.freq div:nth-child(even){font-weight:700;text-align:right}
.setting{display:flex;flex-direction:column;gap:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ottimizzazioni telefono */
:root{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;overscroll-behavior-y:contain}
img{max-width:100%}
[hidden]{display:none!important}
button,.chip,.tab,.day,label.item{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea,.search{font-size:16px!important}
.numin input{font-size:26px!important}
.tab{min-height:52px}
.chip{min-height:38px}
.item{min-height:52px}
.install{display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:12px 14px}
.install p{margin:0;flex:1;font-weight:600;font-size:14px}
.install .btn{background:var(--accent-ink);color:var(--accent)}
.install .x{border:0;background:none;color:inherit;font-size:18px;opacity:.8}
@media (display-mode: standalone){.top{padding-top:14px}}
</style>

</head>
<body>
<header class="top"><div class="top-in"><h1 class="brand">Dieta <span>Sofia</span></h1><div class="top-sub" id="topsub">Piano del 11/10/26</div></div></header>
<main id="view"></main>
<nav class="tabs" aria-label="Sezioni"><div class="tabs-in">
  <button class="tab" data-tab="dieta"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>Dieta</button>
  <button class="tab" data-tab="spesa"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10.6L20.5 7.5H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></span>Spesa</button>
  <button class="tab" data-tab="bilancia"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1.5 10.5h-13z"/><path d="M8.5 9a3.5 3.5 0 0 1 7 0"/><path d="M12 13v3"/></svg></span>Crudo/Cotto</button>
  <button class="tab" data-tab="ricette"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg></span>Ricette</button>
  <button class="tab" data-tab="piano"><span class="ic"><svg viewBox="0 0 24 24"><path d="M7 3.5h7.5L19 8v12.5H7z"/><path d="M14 3.5V8h5M10 12h6M10 15.5h6"/></svg></span>Piano</button>
</div></nav>

const store={get(k,d){try{const v=localStorage.getItem("ds_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("ds_"+k,JSON.stringify(v))}catch(e){}}};
const S={
  tab:"dieta", week:0, day:0,
  start:store.get("start","2026-10-12"),
  shop:store.get("shop",{week:0,days:[0,1,2,3,4,5,6],meals:MEALS.map((_,i)=>i),persons:1}),
  checked:store.get("checked",{}), custom:store.get("custom",[]),
  calc:store.get("calc",{food:"pasta",dir:"rc",val:80,factor:1}),
  recipe:null, rq:""
};
const save=()=>{store.set("shop",S.shop);store.set("checked",S.checked);store.set("custom",S.custom);store.set("calc",S.calc);store.set("start",S.start)};

/* ============ UTILITÀ ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("it-IT");
const kOf=(k,g)=>F[k][1]*g/100;
const r5=n=>Math.round(n/5)*5;
const mealK=ml=>!ml?0:ml.i.reduce((a,[k,g])=>a+kOf(k,g),0);
const dayK=(w,d)=>W[w][d].m.reduce((a,ml)=>a+mealK(ml),0);
const hasFree=(w,d)=>W[w][d].m.some(ml=>ml&&ml.free);
function half(n){const r=Math.max(.5,Math.round(n*2)/2);const w=Math.floor(r);return (w?w:"")+(r-w?"½":"")}
function amount(k,g,shop){
  const f=F[k],u=f[3],ml=f[4]==="ml";
  const gtxt=g>=1000?(g/1000).toLocaleString("it-IT",{maximumFractionDigits:1})+(ml?" l":" kg"):(Math.round(g/(g>50?10:5))*(g>50?10:5))+(ml?" ml":" g");
  if(!u) return {main:gtxt,sub:""};
  const n=g/u[0];
  let lab;
  if(u[3]) {lab=half(n); const one=Math.round(n*2)/2<=1; return {main:lab+" "+(one?u[1]:u[2]),sub:k==="limone"?"":gtxt};}
  const c=shop?Math.max(1,Math.ceil(n-0.15)):Math.max(1,Math.round(n));
  return {main:c+" "+(c===1?u[1]:u[2]),sub:k==="limone"?"":gtxt};
}
function todayRef(){
  const now=new Date();now.setHours(12,0,0,0);
  const st=new Date(S.start+"T12:00:00"); if(isNaN(st)) return {w:0,d:(now.getDay()+6)%7};
  const dow=(now.getDay()+6)%7, sdow=(st.getDay()+6)%7;
  const mon=new Date(now);mon.setDate(now.getDate()-dow);
  const smon=new Date(st);smon.setDate(st.getDate()-sdow);
  const weeks=Math.round((mon-smon)/(7*864e5));
  return {w:((weeks%4)+4)%4,d:dow};
}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

/* ============ VISTA: DIETA ============ */
function vDieta(){
  const ref=todayRef(), isToday=ref.w===S.week&&ref.d===S.day;
  const day=W[S.week][S.day], ks=day.m.map(mealK), tot=ks.reduce((a,b)=>a+b,0), free=hasFree(S.week,S.day);
  const days=DAYS.map((d,i)=>{const t=ref.w===S.week&&ref.d===i;
    return `<button class="day${t?" is-today":""}" data-act="day" data-v="${i}" aria-pressed="${i===S.day}" aria-label="${d.n}"><span class="dn">${d.s}</span><span class="dt t-${DT[i]}"></span><span class="dk">${fmt(r5(dayK(S.week,i)))}${hasFree(S.week,i)?"+":""}</span></button>`}).join("");
  const bar=ks.map((k,i)=>k?`<span class="m${i}" style="flex:${k}"></span>`:"").join("");
  const legend=MEALS_S.map((n,i)=>ks[i]?`<span><i class="m${i}"></i>${n} ${fmt(r5(ks[i]))}</span>`:"").join("");
  const meals=day.m.map((ml,i)=>{ if(!ml) return "";
    const chip=ml.free?`<span class="kc-chip free">libero</span>`:ml.none?"":`<span class="kc-chip">~${fmt(r5(ks[i]))} kcal</span>`;
    const rows=ml.i.map(([k,g])=>{const a=amount(k,g);return `<li><span>${esc(F[k][0])}</span><span class="q">${a.main}${a.sub&&a.sub!==a.main?" · "+a.sub:""}</span><span class="k">${fmt(kOf(k,g))} kcal</span></li>`}).join("");
    const acts=[];
    if(ml.i.length) acts.push(`<details><summary>Dettaglio calorie</summary><ul class="kc">${rows}</ul></details>`);
    if(ml.r) acts.push(`<button class="link" data-act="openrecipe" data-v="${ml.r}">Vedi ricetta →</button>`);
    return `<article class="card meal${ml.none?" is-none":""}"><header><h3><span class="mdot m${i}"></span>${MEALS[i]}</h3>${chip}</header>
      <p class="desc">${ml.d}</p>${ml.x?`<p class="note">${esc(ml.x)}</p>`:""}${acts.length?`<div class="meal-actions">${acts.join("")}</div>`:""}</article>`}).join("");
  return `
  <div class="today-row">${isToday?`<span class="pill">● Oggi</span>`:`<button class="link" data-act="today">← Torna a oggi (Sett. ${ref.w+1}, ${DAYS[ref.d].n})</button>`}<span class="foot">Ciclo di 4 settimane</span></div>
  <div class="seg">${[0,1,2,3].map(i=>`<button data-act="week" data-v="${i}" aria-pressed="${i===S.week}">Sett. ${i+1}</button>`).join("")}</div>
  <div class="days">${days}</div>
  <section class="card">
    <div class="sum-head"><div><div class="eyebrow">${DAYS[S.day].n} · Settimana ${S.week+1}</div><span class="badge t-${day.t}">${TYPE[day.t]}</span></div>
    <div class="total"><span class="num">~${fmt(r5(tot))}</span><span class="unit">kcal</span>${free?`<span class="plus">+ pasto libero</span>`:""}</div></div>
    <div class="bar" aria-hidden="true">${bar}</div><div class="legend">${legend}</div>
  </section>
  ${meals}
  <div class="target">${TARGET}</div>
  <p class="foot">Verdura a volontà a ogni pasto · Acqua 1,5-2 L · Pesi a crudo e al netto degli scarti.</p>
  <p class="foot">Le kcal sono stime calcolate con tabelle nutrizionali medie sulle quantità del piano. A pranzo e cena è incluso 1 cucchiaio d'olio (~90 kcal), tranne quando c'è ½ avocado che lo sostituisce. Dove il piano non indica grammature ho usato le porzioni del tuo schema (carne e pesce 150 g) o porzioni standard (1 frutto ≈ 150 g, 1 manciata di frutta secca ≈ 20 g, 3 crackers ≈ 10 g, 1 fetta di pane ≈ 30 g).</p>`;
}

/* ============ VISTA: SPESA ============ */
function buildList(){
  const map={}; let free=0; const sh=S.shop;
  [...sh.days].sort().forEach(d=>[...sh.meals].sort().forEach(mi=>{
    const ml=W[sh.week][d].m[mi]; if(!ml) return; if(ml.free){free++;return}
    ml.i.forEach(([k,g])=>{(map[k]=map[k]||{g:0,src:[]}).g+=g*sh.persons; if(!map[k].src.includes(DAYS[d].s)) map[k].src.push(DAYS[d].s)});
  }));
  return {map,free};
}
function vSpesa(){
  const sh=S.shop, {map,free}=buildList(), keys=Object.keys(map);
  const grouped=CATS.map(c=>[c,keys.filter(k=>F[k][2]===c).sort((a,b)=>F[a][0].localeCompare(F[b][0],"it"))]).filter(g=>g[1].length);
  const done=keys.filter(k=>S.checked[k]).length;
  const groups=grouped.map(([c,ks])=>`<section class="group"><h4>${c}<small>${ks.length}</small></h4>${ks.map(k=>{const a=amount(k,map[k].g,true),dn=!!S.checked[k];
    return `<label class="item${dn?" done":""}"><input type="checkbox" data-chk="${k}"${dn?" checked":""}><span class="nm">${esc(F[k][0])}</span><span class="q">${a.main}</span><span class="src">${a.sub&&a.sub!==a.main?a.sub+" · ":""}${map[k].src.length===7?"tutta la settimana":map[k].src.join(", ")}</span></label>`}).join("")}</section>`).join("");
  const custom=S.custom.map((c,i)=>`<div class="item${c.done?" done":""}"><input type="checkbox" data-cchk="${i}"${c.done?" checked":""} aria-label="Preso"><span class="nm">${esc(c.t)}</span><button class="del" data-act="cdel" data-v="${i}" aria-label="Rimuovi">✕</button></div>`).join("");
  return `
  <h2 class="h">Lista della spesa</h2>
  <div class="field"><div class="lab">Settimana</div><div class="seg">${[0,1,2,3].map(i=>`<button data-act="sweek" data-v="${i}" aria-pressed="${i===sh.week}">Sett. ${i+1}</button>`).join("")}</div></div>
  <div class="field"><div class="lab">Giorni<span class="sp"></span><button class="mini" data-act="sdaysall">Tutti</button><button class="mini" data-act="sdaysnone">Nessuno</button></div>
    <div class="chips">${DAYS.map((d,i)=>`<button class="chip" data-act="sday" data-v="${i}" aria-pressed="${sh.days.includes(i)}">${d.s}</button>`).join("")}</div></div>
  <div class="field"><div class="lab">Pasti<span class="sp"></span><button class="mini" data-act="smealsall">Tutti</button><button class="mini" data-act="smealsnone">Nessuno</button></div>
    <div class="chips">${MEALS_S.map((n,i)=>`<button class="chip" data-act="smeal" data-v="${i}" aria-pressed="${sh.meals.includes(i)}">${n}</button>`).join("")}</div></div>
  <div class="row-between"><div class="lab">Persone</div><div class="stepper"><button data-act="pers" data-v="-1" aria-label="Meno">−</button><span>${sh.persons}</span><button data-act="pers" data-v="1" aria-label="Più">+</button></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:6px">
    <div class="row-between"><div><b>${keys.length} prodotti</b> <span class="muted">· ${done} presi</span></div>
      <div style="display:flex;gap:8px"><button class="btn ghost" data-act="uncheck">Azzera spunte</button><button class="btn" data-act="copy">Copia lista</button></div></div>
    ${free?`<p class="note">Esclus${free>1?"i":"o"} ${free} pasto libero.</p>`:""}
    <textarea id="copybox" hidden readonly></textarea>
    ${keys.length?groups:`<div class="empty">Scegli almeno un giorno e un pasto per vedere la lista.</div>`}
    <section class="group"><h4>Aggiunti da te<small>${S.custom.length}</small></h4>
      <form class="addf" id="addf"><input id="addi" placeholder="Es. detersivo, caffè…" autocomplete="off"><button class="btn" type="submit">Aggiungi</button></form>${custom}</section>
  </div>
  <p class="foot">Le quantità sono a crudo e arrotondate; i prodotti a confezione sono arrotondati per eccesso. La spunta resta salvata su questo telefono.</p>`;
}
function listText(){
  const sh=S.shop,{map}=buildList(),keys=Object.keys(map);
  let t=`Lista spesa – Settimana ${sh.week+1} (${[...sh.days].sort().map(d=>DAYS[d].s).join(", ")})${sh.persons>1?` – ${sh.persons} persone`:""}\n`;
  CATS.forEach(c=>{const ks=keys.filter(k=>F[k][2]===c&&!S.checked[k]); if(!ks.length) return;
    t+=`\n${c.toUpperCase()}\n`+ks.map(k=>`- ${F[k][0]}: ${amount(k,map[k].g,true).main}`).join("\n")+"\n"});
  const cu=S.custom.filter(c=>!c.done); if(cu.length) t+="\nALTRO\n"+cu.map(c=>"- "+c.t).join("\n")+"\n";
  return t;
}

/* ============ VISTA: CRUDO/COTTO ============ */
function vCalc(){
  const c=S.calc, it=c.food==="custom"?null:CBY[c.food];
  const opts=CALC.map(([g,items])=>`<optgroup label="${g}">${items.map(i=>`<option value="${i[0]}"${i[0]===c.food?" selected":""}>${i[1]}</option>`).join("")}</optgroup>`).join("")+`<option value="custom"${c.food==="custom"?" selected":""}>Personalizzato (inserisci il fattore)</option>`;
  const f=it?it[2]:(+c.factor||1);
  const presets=it?it[4].map(g=>`<button class="chip" data-act="preset" data-v="${g}">${g} g crudi</button>`).join(""):"";
  const rows=CALC.map(([g,items])=>`<tr class="grp"><td colspan="3">${g}</td></tr>`+items.map(i=>`<tr><td>${i[1]}</td><td>×${i[2].toLocaleString("it-IT",{minimumFractionDigits:2})}</td><td>100 g → ${fmt(100*i[2])} g</td></tr>`).join("")).join("");
  return `
  <h2 class="h">Crudo ↔ Cotto</h2>
  <div class="seg"><button data-act="dir" data-v="rc" aria-pressed="${c.dir==="rc"}">Crudo → Cotto</button><button data-act="dir" data-v="cr" aria-pressed="${c.dir==="cr"}">Cotto → Crudo</button></div>
  <label class="field" for="cfood"><span class="lab">Alimento e cottura</span><select id="cfood">${opts}</select></label>
  ${it?"":`<label class="field factor" for="cfac"><span class="lab">Fattore (peso cotto ÷ peso crudo)</span><input id="cfac" type="number" inputmode="decimal" step="0.05" min="0.1" value="${c.factor}"></label>`}
  <label class="field" for="cval"><span class="lab" id="cvlab">Peso ${c.dir==="rc"?"crudo":"cotto"}</span><div class="numin"><input id="cval" type="number" inputmode="decimal" min="0" value="${c.val}"><span>g</span></div></label>
  ${presets?`<div class="field"><div class="lab">Porzioni del piano</div><div class="chips">${presets}</div></div>`:""}
  <section class="card result" aria-live="polite"><div class="eyebrow" id="cres-l"></div><div class="big" id="cres"></div><div class="sub" id="csub"></div></section>
  <details class="card"><summary>Tabella dei fattori</summary><div class="tbl-wrap"><table class="ft"><thead><tr><th>Alimento</th><th>Fattore</th><th>Esempio</th></tr></thead><tbody>${rows}</tbody></table></div></details>
  <p class="foot">Fattori medi indicativi: il risultato varia con tempo di cottura, varietà e quanta acqua resta. La dietista indica: pasta ×2 (70 → 140 g), riso ×2-3 (70 → 150-200 g), patate invariate. Per il riso basmati, se dopo la cottura pesa meno, usa "Riso bianco". Se vuoi la massima precisione, pesa una volta il tuo crudo e il tuo cotto e usa "Personalizzato".</p>`;
}
function updCalc(){
  const c=S.calc,it=c.food==="custom"?null:CBY[c.food],f=it?it[2]:(+c.factor||1),v=+c.val||0;
  const out=c.dir==="rc"?v*f:v/f, raw=c.dir==="rc"?v:out;
  $("#cres-l").textContent=c.dir==="rc"?"Peso cotto":"Peso crudo da pesare";
  $("#cres").textContent=fmt(out)+" g";
  $("#csub").textContent=`Fattore ×${f.toLocaleString("it-IT",{maximumFractionDigits:2})}`+(it?` · ≈ ${fmt(raw*it[3]/100)} kcal (${fmt(raw)} g crudi)`:"");
}

/* ============ VISTA: RICETTE ============ */
function recK(r){return r.ing.reduce((a,x)=>Array.isArray(x)?a+kOf(x[0],x[1]):a,0)}
function vRicette(){
  if(S.recipe&&RBY[S.recipe]){
    const r=RBY[S.recipe];
    const uses=[];W.forEach((w,wi)=>w.forEach((d,di)=>d.m.forEach((ml,mi)=>{if(ml&&ml.r===r.id) uses.push(`Sett. ${wi+1} · ${DAYS[di].s} · ${MEALS_S[mi]}`)})));
    const ing=r.ing.map(x=>Array.isArray(x)?`<li><span>${esc(F[x[0]][0])}${x[2]?` <span class="muted">(${esc(x[2])})</span>`:""}</span><span>${x[0]==="limone"?"":amount(x[0],x[1]).sub||amount(x[0],x[1]).main}</span></li>`:`<li><span>${esc(x)}</span><span></span></li>`).join("");
    return `<button class="link" data-act="closerecipe">← Tutte le ricette</button>
    <article class="card rdetail"><div><span class="tag${r.src?" diet":""}">${r.src?"Dalla dietista":"Dal piano settimanale"}</span><span class="tag">${esc(r.time)}</span></div>
      <h3>${esc(r.t)}</h3><p class="note">${esc(r.serv)} · ≈ ${fmt(r5(recK(r)))} kcal in totale</p>
      <h4>Ingredienti</h4><ul class="ing">${ing}</ul>
      <h4>Preparazione</h4><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      ${uses.length?`<h4>Nel tuo piano</h4><p class="note" style="margin-top:2px">${uses.join("<br>")}</p>`:""}
      <div style="margin-top:14px"><button class="btn" data-act="rec2shop" data-v="${r.id}">Aggiungi ingredienti alla spesa</button></div>
    </article>`;
  }
  const q=S.rq.trim().toLowerCase();
  const list=R.filter(r=>!q||(r.t+" "+r.ing.map(x=>Array.isArray(x)?F[x[0]][0]:x).join(" ")).toLowerCase().includes(q));
  return `<h2 class="h">Ricette</h2>
  <input class="search" id="rq" type="search" placeholder="Cerca per nome o ingrediente (es. zucca)" value="${esc(S.rq)}">
  <div class="rlist" id="rlist">${list.map(r=>`<button class="rcard" data-act="openrecipe" data-v="${r.id}"><span class="rt">${esc(r.t)}</span><span class="kc-chip">~${fmt(r5(recK(r)))} kcal</span><span class="rm"><span class="tag${r.src?" diet":""}">${r.src?"Dietista":"Dal piano"}</span>${esc(r.time)} · ${esc(r.serv)}</span></button>`).join("")||`<div class="empty">Nessuna ricetta trovata.</div>`}</div>
  <p class="foot">Le ricette "Dietista" sono quelle del tuo documento; le altre sono preparazioni semplici dei piatti del piano settimanale, con le stesse grammature. Le kcal si riferiscono a tutta la ricetta.</p>`;
}

/* ============ VISTA: PIANO ============ */

  const pm=PLAN.map(p=>`<details open><summary>${p.t}</summary>${p.meals.map(ml=>`<div class="pm"><h5>${ml.m}</h5><ul>${ml.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${(ml.alt||[]).map(([h,l])=>`<div class="alt">${esc(h)}:</div><ul>${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`).join("")}${ml.n?`<p class="note">${esc(ml.n)}</p>`:""}</div>`).join("")}</details>`).join("");
  return `<h2 class="h">Il piano</h2>
  <div class="card setting"><label class="lab" for="start">La Settimana 1 è iniziata il</label><input id="start" type="date" value="${esc(S.start)}"><p class="note" style="margin:0">Serve a mostrare automaticamente la settimana e il giorno di oggi. Dopo la Settimana 4 si ricomincia dalla 1.</p></div>
  <div class="plan" style="display:flex;flex-direction:column;gap:10px">
  ${pm}
  <details><summary>Rotazione dei secondi</summary><div class="freq">${FREQ.map(([a,b])=>`<div>${a}</div><div>${b}</div>`).join("")}</div></details>
  <details><summary>Consigli e regole</summary><div class="pm"><ul>${TIPS.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>
  <details><summary>Alimenti per categoria</summary>${GROUPS.map(([a,b])=>`<div class="pm"><h5>${a}</h5><p style="margin:0">${esc(b)}</p></div>`).join("")}</details>
  <details><summary>Integrazione consigliata</summary><div class="pm"><ul>${SUPPL.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>
  </div>
  <p class="foot">Piano alimentare di Sofia Gilli · Dott.ssa Daniela Maietta, dietista · 11/10/26. Per dubbi o modifiche contatta la dietista.</p>`;

/* ============ RENDER + EVENTI ============ */
const VIEWS={dieta:vDieta,spesa:vSpesa,bilancia:vCalc,ricette:vRicette,piano:vPiano};
function render(){
  $("#view").innerHTML=VIEWS[S.tab]();
  document.querySelectorAll(".tab").forEach(b=>b.toggleAttribute("aria-current",false)||(b.dataset.tab===S.tab&&b.setAttribute("aria-current","page")));
  if(S.tab==="bilancia") updCalc();
}
function go(tab,keepScroll){S.tab=tab; if(location.hash!=="#"+tab) history.replaceState(null,"","#"+tab); render(); if(!keepScroll) window.scrollTo(0,0)}

document.addEventListener("click",e=>{
  const tb=e.target.closest(".tab"); if(tb){ if(tb.dataset.tab==="ricette"&&S.tab==="ricette") S.recipe=null; go(tb.dataset.tab); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v, sh=S.shop;
  const tog=(arr,x)=>arr.includes(x)?arr.filter(y=>y!==x):arr.concat(x);
  switch(a){
    case "week": S.week=+v; break;
    case "day": S.day=+v; break;
    case "today": {const r=todayRef();S.week=r.w;S.day=r.d;break}
    case "sweek": sh.week=+v; break;
    case "sday": sh.days=tog(sh.days,+v); break;
    case "sdaysall": sh.days=[0,1,2,3,4,5,6]; break;
    case "sdaysnone": sh.days=[]; break;
    case "smeal": sh.meals=tog(sh.meals,+v); break;
    case "smealsall": sh.meals=MEALS.map((_,i)=>i); break;
    case "smealsnone": sh.meals=[]; break;
    case "pers": sh.persons=Math.min(8,Math.max(1,sh.persons+ +v)); break;
    case "uncheck": S.checked={}; S.custom.forEach(c=>c.done=false); break;
    case "cdel": S.custom.splice(+v,1); break;
    case "copy": {
      const t=listText(), box=$("#copybox");
      const fallback=()=>{box.hidden=false;box.value=t;box.focus();box.select();toast("Tieni premuto sul testo per copiarlo")};
      try{navigator.clipboard.writeText(t).then(()=>toast("Lista copiata: incollala dove vuoi"),fallback)}catch(err){fallback()}
      return;
    }
    case "dir": {
      const c=S.calc,it=c.food==="custom"?null:CBY[c.food],f=it?it[2]:(+c.factor||1);
      if(c.dir!==v){c.val=Math.round(c.dir==="rc"?c.val*f:c.val/f);c.dir=v} break;
    }
    case "preset": {const c=S.calc,it=CBY[c.food];c.val=c.dir==="rc"?+v:Math.round(+v*it[2]);break}
    case "openrecipe": S.recipe=v; save(); go("ricette"); return;
    case "closerecipe": S.recipe=null; break;
    case "rec2shop": {const r=RBY[v]; r.ing.forEach(x=>S.custom.push({t:Array.isArray(x)?`${F[x[0]][0]}${x[0]==="limone"?"":" – "+(amount(x[0],x[1]).sub||amount(x[0],x[1]).main)} (${r.t})`:`${x} (${r.t})`,done:false})); save(); toast("Ingredienti aggiunti alla lista della spesa"); return;}
    default: return;
  }
  save(); render();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.chk){S.checked[t.dataset.chk]=t.checked;if(!t.checked)delete S.checked[t.dataset.chk];save();render();return}
  if(t.dataset.cchk!==undefined){S.custom[+t.dataset.cchk].done=t.checked;save();render();return}
  if(t.id==="cfood"){S.calc.food=t.value;save();render();return}
  if(t.id==="start"&&t.value){S.start=t.value;save();const r=todayRef();S.week=r.w;S.day=r.d;toast(`Oggi è Settimana ${r.w+1}, ${DAYS[r.d].n}`);return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="cval"){S.calc.val=t.value;save();updCalc()}
  if(t.id==="cfac"){S.calc.factor=t.value;save();updCalc()}
  if(t.id==="rq"){S.rq=t.value;const pos=t.selectionStart;render();const n=$("#rq");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="addf"){e.preventDefault();const v=$("#addi").value.trim();if(v){S.custom.push({t:v,done:false});save();render();$("#addi").focus()}}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==S.tab){S.tab=h;render();window.scrollTo(0,0)}});

(function init(){
  const r=todayRef(); S.week=r.w; S.day=r.d;
  const h=location.hash.slice(1); if(VIEWS[h]) S.tab=h;
  render();
})();
/* ============ WEB APP: installazione + offline ============ */
let deferredPrompt=null;
function installBanner(){
  if(!deferredPrompt||store.get("noinstall",false)||document.getElementById("inst")) return;
  const el=document.createElement("div");el.className="install";el.id="inst";
  el.innerHTML='<p>Installa Dieta Sofia sul telefono: si apre come un\'app e funziona anche offline.</p><button class="btn" id="instb">Installa</button><button class="x" id="instx" aria-label="Chiudi">✕</button>';
  $("#view").prepend(el);
  $("#instb").onclick=async()=>{el.remove();deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null};
  $("#instx").onclick=()=>{el.remove();store.set("noinstall",true)};
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;installBanner()});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;const el=$("#inst");if(el)el.remove();toast("App installata")});
const _render=render; render=function(){_render();installBanner()};
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
